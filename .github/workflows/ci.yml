name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    name: Backend Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    defaults:
      run:
        working-directory: .

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run backend and ML tests
        env:
          ENV: test
          DATABASE_URL: "sqlite:///./.pytest_temp_db.sqlite"
          JWT_SECRET: "ci_test_jwt_secret_1234567890_abcdef"
        run: python -m pytest backend/tests/ ml-engine/tests/ -v --tb=short

      - name: Verify clean migration
        working-directory: backend
        env:
          ENV: test
          DATABASE_URL: "sqlite:///./.ci_migration.sqlite"
          JWT_SECRET: "ci_test_jwt_secret_1234567890_abcdef"
        run: |
          python -m alembic -c alembic.ini upgrade head
          python -c "import sqlite3; from alembic.config import Config; from alembic.script import ScriptDirectory; expected=ScriptDirectory.from_config(Config('alembic.ini')).get_current_head(); c=sqlite3.connect('.ci_migration.sqlite'); actual=c.execute('select version_num from alembic_version').fetchone()[0]; assert actual == expected, f'Alembic version mismatch: {actual} != {expected}'; assert {'latitude','longitude'} <= {r[1] for r in c.execute('pragma table_info(meters)')}; assert 'ingest_key' in {r[1] for r in c.execute('pragma table_info(readings)')}; c.close()"
          rm -f .ci_migration.sqlite

  frontend-typecheck:
    name: Frontend Type Check
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Design token contract
        run: npm run design:check --prefix ..

      - name: Production dependency audit
        run: npm audit --omit=dev

  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint
